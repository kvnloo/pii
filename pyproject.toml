[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paw-pii"
version = "0.1.0"
description = "Detect and type PII locally with one ProgramAsWeights neural program"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.6",
  "huggingface-hub>=0.34",
  "httpx>=0.28",
  "programasweights>=0.4.2",
  "requests>=2.32",
  "safetensors>=0.5",
  "torch>=2.5",
  "transformers>=4.51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
paw-pii = "paw_pii.cli:main"
paw-pii-mcp = "paw_pii.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paw_pii"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
